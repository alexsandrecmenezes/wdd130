<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/rafting.css">
    <title>Fale Conosco e o nome da empresa de rafting.</title>
    <meta name="description"
      content="A meta Correnteza AdrenaRafting é proporcionar momentos únicos em sua vida.">
    <meta name="author" content="Alexsandre da Costa Menezes">
</head>

<body>
    <header>
        <img src="imagens/logo-rafting.jpg" alt="Logo site">
        <nav>
            <ul class="navegacao">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="informacao">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <article>
                <p>123 Rua Principal do Rio</p>
                <p>Foz do Iguaçu, Paraná</p>
                <p>+55 45 99999-9999</p>
                <p>info@correiras.com</p>
            </article>
        </div>
        <div class="mapa-formulario">
            <div class="mapa">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14987.285641003939!2d-44.549699304004584!3d-20.099751001876836!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1785442140763!5m2!1spt-BR!2sbr"
                  width="520" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
            <div class="formulario">
                <form>
                    <div class="dados">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome">
                        <label for="email">Email:</label>
                        <input type="text" id="email" name="email">
                    </div>
                    <div class="opcoes">
                        <span class="proposito">Proposito da mensagem:</span>
                        <div class="escolher">
                            <label><input type="radio" id="duvida" name="proposito" value="duvida"
                                  checked>
                                Duvida
                                Geral</label>
                            <label><input type="radio" id="reserva" name="proposito" value="reserva"
                                  checked>
                                Pergunta sobre reserva</label>
                            <label><input type="radio" id="sugestao" name="proposito"
                                  value="sugestao" checked>
                                sugestao</label>
                        </div>
                    </div>
                    <div class="mensagem">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="4"></textarea>
                    </div>
                    <div class="newsletter">
                        <label>
                            <input type="checkbox" id="newsletter" name="newsletter">Por favor, me
                            inscreva na newsletter mensal
                            <button type="submit">Entrar em contato</button>
                        </label>
                    </div>
                </form>
            </div>
        </div>
        <section class="historia">
            <h2>Estamos aqui para servi-lo.</h2>
            <img src="imagens/perfil.jpg" alt="Foto Perfil">
            <img src="imagens/perfil.jpg" alt="Foto Perfil">
            <img src="imagens/perfil.jpg" alt="Foto Perfil">

        </section>
    </main>
    <footer>
        <p>© 2026 | Correnteza AdrenaRafting | Alexsandre Menezes</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook.jpg" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin.jpg" alt="Ícone do linkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram.jpg" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
